services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relicrat}
      POSTGRES_USER: ${POSTGRES_USER:-relicrat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relicrat} -d ${POSTGRES_DB:-relicrat}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relicrat}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-relicrat}
      MEDIA_ROOT: /var/lib/relicrat/media
    volumes:
      - media_data:/var/lib/relicrat/media
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      RELICRAT_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
volumes:
  postgres_data:
  media_data:
