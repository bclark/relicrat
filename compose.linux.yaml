# Private single-owner installation on a Linux Docker Engine.
services:
  db:
    image: postgres:17-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: relicrat
      POSTGRES_USER: relicrat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a private install .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "relicrat", "-d", "relicrat"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    image: relicrat-api:${RELICRAT_RELEASE:?Export the pinned source commit}
    build: ./apps/api
    pull_policy: never
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://relicrat:${POSTGRES_PASSWORD:?Generate a private install .env file}@db:5432/relicrat
      MEDIA_ROOT: /var/lib/relicrat/media
      RELICRAT_OWNER_PASSWORD_HASH: ${RELICRAT_OWNER_PASSWORD_HASH:?Generate a private install .env file}
      RELICRAT_SESSION_SECRET: ${RELICRAT_SESSION_SECRET:?Generate a private install .env file}
    volumes:
      - media_data:/var/lib/relicrat/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 3s
      timeout: 5s
      retries: 20
  web:
    image: relicrat-web:${RELICRAT_RELEASE:?Export the pinned source commit}
    build: ./apps/web
    pull_policy: never
    restart: unless-stopped
    environment:
      RELICRAT_API_URL: http://api:8000
      RELICRAT_WEB_ORIGIN: http://127.0.0.1:3000
      RELICRAT_ALLOW_LOOPBACK_HTTP: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  media_data:
networks:
  default:
    internal: true
