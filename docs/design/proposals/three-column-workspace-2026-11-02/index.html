<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RelicRat — three-column workspace concept</title>
<style>
:root{--page:#F7F3E9;--paper:#fff;--ink:#302B28;--muted:#595650;--rule:#C6C9C3;--accent:#823B3D;--soft:#E8EEE9;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--page);color-scheme:light}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button,input,select,textarea{border:1px solid var(--rule);border-radius:6px;background:var(--paper)}button{cursor:pointer;min-height:44px;padding:8px 12px;font-weight:600}button:hover{background:var(--soft)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}::selection{background:var(--accent);color:white}input,textarea{caret-color:var(--accent)}input,select,textarea{width:100%;min-width:0;padding:9px 10px;min-height:44px}textarea{resize:vertical}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-.025em;line-height:1.2}h2{font-size:20px;line-height:1.3}h3{font-size:16px}small,.muted{color:var(--muted);font-size:14px}header{padding:20px 32px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:25px;font-weight:750;letter-spacing:-.03em}header small{margin-left:20px}details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:12px;font-weight:600;list-style:none}details>summary::-webkit-details-marker{display:none}summary:after{content:'+';font-size:20px;margin-left:auto}details[open]>summary:after{content:'−'}.desktop-utilities{display:flex;gap:8px}.desktop-utilities button{border:0;background:transparent;font-size:14px}header details{display:none;position:relative}header summary{padding:0 12px}header details>div{position:absolute;z-index:5;right:0;top:48px;width:235px;background:var(--paper);padding:8px;border:1px solid var(--rule);border-radius:6px;box-shadow:0 12px 30px #302b2820}header details button{display:block;width:100%;text-align:left;border:0}.workspace{display:grid;grid-template-columns:232px minmax(0,1fr) 320px;gap:28px;max-width:1700px;margin:0 auto;padding:32px}.rail{min-width:0}.intake summary{font-size:20px}.intake summary:after{display:none}.intake form{display:grid;gap:14px;padding-top:16px}.field{display:grid;gap:5px;font-size:14px;font-weight:600}.field small{font-weight:400}.primary{color:white;background:var(--accent);border-color:var(--accent)}.primary:hover{background:#6b2f31}.intake p{font-size:14px;color:var(--muted)}.categories{margin-top:36px}.categories h2{margin-bottom:12px}.category-list{display:grid;gap:2px}.category{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;text-align:left;font-weight:400}.category[aria-pressed=true]{background:var(--soft);font-weight:650}.category span{font-size:14px;font-variant-numeric:tabular-nums}.collection{min-width:0;border-left:1px solid var(--rule);padding-left:28px}.collection-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.view-switch{display:flex;gap:2px}.view-switch button{font-size:14px;background:transparent;border-color:transparent;padding:8px 10px}.view-switch button[aria-pressed=true]{color:var(--accent);border-color:var(--accent);background:var(--paper)}.search{display:block;margin:22px 0 10px}.search input{background:transparent}.search span{display:block;margin-bottom:6px;font-size:14px}.results-caption{margin:0 0 22px;font-size:14px;color:var(--muted)}.group{margin-bottom:26px}.group h2{font-size:16px;padding-bottom:8px}.items{list-style:none;padding:0;margin:0}.item{width:100%;border:0;border-top:1px solid var(--rule);border-radius:0;background:transparent;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;text-align:left;min-height:70px;padding:12px 8px;font-weight:400}.item[aria-pressed=true]{background:var(--soft)}.item-title{font-weight:650;overflow-wrap:anywhere}.item-edition{font-size:14px;color:var(--muted);display:block}.item-location{font-size:13px;color:var(--muted);text-align:right;max-width:105px}.tile-note{display:none}.bricks .items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px;align-items:start}.bricks .item{display:block;min-height:130px;padding:14px 8px 22px}.bricks .item-location{display:block;text-align:left;max-width:none;margin-top:8px}.bricks .tile-note{display:block;font-size:14px;color:var(--muted);margin-top:14px;line-height:1.5}.inspector{border-left:1px solid var(--rule);padding-left:28px;min-width:0}.back{display:none;border:0;background:transparent;padding:4px 0;color:var(--accent);margin-bottom:16px}.detail-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:22px}.detail-heading h2{font-size:16px;color:var(--muted);font-weight:500}.detail-title{font-size:25px;line-height:1.25;letter-spacing:-.02em;overflow-wrap:anywhere;margin-bottom:8px}.detail-edition{color:var(--muted);margin-bottom:28px}.facts{margin:0 0 28px}.facts div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--rule);font-size:14px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.detail-section{margin-bottom:28px}.detail-section h3{margin-bottom:8px}.detail-section p{font-size:14px;line-height:1.65;max-width:65ch}.detail-action{width:100%;background:transparent}.demo-note{max-width:1700px;padding:8px 32px 24px;margin:auto;color:var(--muted);font-size:12px}#notice:empty{display:none}#notice{padding:8px 32px;background:var(--soft);font-size:14px}#save-status{font-size:14px;color:var(--accent)}.empty{padding:25px 0;color:var(--muted)}[hidden]{display:none!important}
@media(min-width:1500px){.workspace{grid-template-columns:248px minmax(0,1fr) 352px;gap:36px}.collection,.inspector{padding-left:36px}.item-edition{display:inline;margin-left:10px}}
@media(max-width:1179px){.workspace{grid-template-columns:220px minmax(0,1fr);gap:26px}.inspector{display:none}.workspace.show-detail .inspector{display:block}.workspace.show-detail .collection{display:none}.back{display:block}.detail-title{max-width:24ch}.inspector .detail-action{max-width:320px}}
@media(max-width:759px){.desktop-utilities{display:none}header details{display:block}header{padding:14px 18px}.brand{font-size:23px}header small{display:none}.workspace{display:block;padding:20px 18px}.intake summary:after{display:block}.intake summary{font-size:18px}.intake form{padding-bottom:12px}.categories{margin-top:20px}.categories h2{font-size:16px;margin-bottom:8px}.category-list{display:flex;gap:4px;flex-wrap:wrap}.category{gap:12px;padding:8px 10px}.collection,.inspector{border-left:0;padding-left:0;margin-top:28px}.workspace.show-detail .rail{display:none}.workspace.show-detail .inspector{margin-top:0}.collection-top{gap:4px}h1{font-size:26px}.view-switch button{padding:8px}.search{margin-top:18px}.item{grid-template-columns:minmax(0,1fr) 85px}.bricks .items{gap:0 12px}.bricks .item{padding-left:4px;padding-right:4px}.detail-title{font-size:28px}.demo-note{padding:8px 18px 24px}#notice{padding:8px 18px}}

/* Quick intake and Finder-inspired list refinement. */
.intake h2{font-size:20px}.intake #quick-form{display:block;padding-top:14px}.quick-entry{display:flex;gap:6px;margin-top:6px}.quick-entry input{flex:1;min-width:0;font-size:14px}.quick-entry button{flex:0 0 44px;padding:8px;display:grid;place-items:center}.early-type{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}.early-type select{width:auto;flex:1;font-size:14px}.continue{width:100%;margin-top:10px;background:transparent;font-size:14px}.review-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.text-action{border:0;background:transparent;padding:3px 0;color:var(--accent);font-size:13px;font-weight:500}.intake #intake-form{padding-top:20px}.intake-review,#intake-review{display:grid;gap:12px}#barcode-status{overflow-wrap:anywhere}#scanner{padding-top:20px;display:grid;gap:10px}#scanner button{font-size:14px}#save-status:empty{display:none}.categories{margin-top:28px}.results-caption{margin-bottom:12px}.group{margin-bottom:16px}.group h2{font-size:14px;padding:7px 8px 5px;color:var(--muted);font-weight:600}.column-head,.item{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.95fr) minmax(0,.9fr);gap:12px}.column-head{padding:7px 8px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--muted);background:var(--paper)}.item{min-height:30px;padding:4px 8px;border:0;border-radius:4px;font-size:14px;line-height:22px}.items li:nth-child(even) .item{background:#302b2808}.item:hover,.items li:nth-child(even) .item:hover{background:var(--soft)}.item[aria-pressed=true],.items li:nth-child(even) .item[aria-pressed=true]{background:var(--accent);color:white}.item-title{font-weight:500}.item-title,.item-edition,.item-location{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin:0;text-align:left;max-width:none;font-size:14px}.item[aria-pressed=true] .item-edition,.item[aria-pressed=true] .item-location{color:white}.bricks .column-head{display:none}.bricks .item{min-height:130px;font-size:16px;line-height:1.5}.bricks .item-title{font-weight:650;font-size:16px;white-space:normal}.bricks .item-edition{margin-top:3px;white-space:normal}.bricks .item-location{font-size:13px;white-space:normal}.bricks .items li:nth-child(even) .item{background:transparent}.bricks .item[aria-pressed=true],.bricks .items li:nth-child(even) .item[aria-pressed=true]{background:var(--soft);color:var(--ink)}.bricks .item[aria-pressed=true] .item-edition,.bricks .item[aria-pressed=true] .item-location{color:var(--muted)}
@media(pointer:coarse){.item{min-height:44px}}
@media(max-width:759px){.intake h2{font-size:18px}.intake #quick-form{padding-bottom:0}.early-type select{max-width:180px}.column-head{display:none}.item{min-height:44px;grid-template-columns:minmax(0,1fr) 100px;gap:0 10px;padding:5px 8px}.item-edition{grid-column:1;font-size:12px;line-height:18px}.item-location{grid-column:2;grid-row:1 / span 2;font-size:12px;white-space:normal;align-self:center}.item-title{font-size:14px}.intake #quick-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px}.intake #quick-form>.field,.quick-entry,.early-type{grid-column:1 / -1}.continue{grid-column:2;grid-row:3;padding:4px 12px;margin-top:8px;width:auto}.early-type{grid-column:1;grid-row:3;margin-top:8px}.early-type select{max-width:160px;padding-left:8px;padding-right:4px}.categories{margin-top:22px}.bricks .item{display:block}.bricks .item-edition{font-size:14px}.bricks .item-location{font-size:13px}}
</style>
</head>
<body>
<header><div><span class="brand">RelicRat</span><small>Your collection, in order.</small></div><nav class="desktop-utilities" aria-label="Utilities"><button type="button" data-utility="Appearance">Appearance</button><button type="button" data-utility="Collection settings">Collection settings</button><button type="button" data-utility="Sign out">Sign out</button></nav><details id="menu"><summary>Menu</summary><div><button type="button" data-utility="Appearance">Appearance</button><button type="button" data-utility="Collection settings">Collection settings</button><button type="button" data-utility="Sign out">Sign out</button></div></details></header>
<p id="notice" role="status"></p>
<main class="workspace" id="workspace">
<aside class="rail" aria-label="Add and browse">
<section class="intake" id="intake" aria-labelledby="intake-heading"><h2 id="intake-heading">Add an item</h2>
<form id="quick-form"><label class="field" for="quick-entry">Title or barcode</label><div class="quick-entry"><input id="quick-entry" maxlength="180" placeholder="Type, then press Enter" autocomplete="off" aria-controls="intake-review" aria-expanded="false"><button type="button" id="scan" aria-label="Scan barcode" title="Scan barcode" aria-controls="scanner" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scan-barcode" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M8 7v10"></path><path d="M12 7v10"></path><path d="M17 7v10"></path></svg></button></div><label class="early-type" for="type">Item type<select id="type"><option value="Albums">Album</option><option value="Comics">Comic</option><option value="Other finds">Other find</option></select></label><button class="continue" type="submit">Continue</button></form>
<section id="scanner" hidden aria-label="Barcode scanner preview"><h3>Scan a barcode</h3><p>Camera scanning is simulated in this layout preview.</p><button type="button" id="sample-scan">Try a sample scan</button><button type="button" class="text-action" id="cancel-scan">Cancel scan</button></section>
<form id="intake-form" hidden><div id="intake-review"><div class="review-heading"><h3>Review item</h3><button type="button" class="text-action" id="collapse-intake">Hide details</button></div><p id="barcode-status" role="status" hidden></p><label class="field">Title<input id="title" required maxlength="180" placeholder="Name this item"></label><label class="field">Notes <small>Optional</small><textarea id="notes" rows="2" placeholder="A detail to remember"></textarea></label><button class="primary" type="submit">Save copy</button></div></form><p id="save-status" role="status"></p>
</section>
<nav class="categories" aria-label="Categories"><h2>Categories</h2><div class="category-list" id="categories"></div></nav>
</aside>
<section class="collection" aria-labelledby="collection-title"><div class="collection-top"><h1 id="collection-title">Collection</h1><div class="view-switch" aria-label="Collection view"><button type="button" id="list-view" aria-pressed="true">List</button><button type="button" id="brick-view" aria-pressed="false">Bricks</button></div></div><label class="search"><span>Find in your collection</span><input id="search" type="search" placeholder="Search titles, editions or notes"></label><p class="results-caption" id="result-count" role="status"></p><div id="results"></div></section>
<section class="inspector" id="inspector" aria-label="Selected item"><button type="button" class="back" id="back">Back to collection</button><div class="detail-heading"><h2>Item details</h2></div><div id="detail"></div></section>
</main>
<p class="demo-note">Layout exploration · Fictional collection · Changes last only until refresh</p>
<script>
const data=[
{id:1,type:'Albums',title:'Glass Arcade',edition:'Blue vinyl, 2022',location:'Living room shelf',notes:'Bought at the Sunday record fair. Sleeve still has the original shop sticker.',condition:'Very good',identity:'Not linked to a catalog'},
{id:2,type:'Albums',title:'Night Garden',edition:'Second pressing',location:'Unassigned',notes:'Gatefold sleeve. Check the runout before identifying the release.',condition:'Not recorded',identity:'Not linked to a catalog'},
{id:3,type:'Albums',title:'The Long Way Home',edition:'',location:'Living room shelf',notes:'A gift from a friend.',condition:'Not recorded',identity:'Not linked to a catalog'},
{id:4,type:'Comics',title:'Moon Harbor #08',edition:'Alternate cover',location:'Short box A',notes:'Kept with the rest of the Moon Harbor run.',condition:'Not recorded',identity:'Not linked to a catalog'},
{id:5,type:'Comics',title:'Paper City #01',edition:'First printing',location:'Short box A',notes:'Unsigned. Small crease at the lower corner.',condition:'Not recorded',identity:'Not linked to a catalog'},
{id:6,type:'Other finds',title:'Small tin robot',edition:'',location:'Display cabinet',notes:'Maker unknown. Wind-up mechanism needs checking.',condition:'Not recorded',identity:'Not identified'}
];
const types=['Albums','Comics','Other finds'];let category='All items',selected=1,view='list';const $=id=>document.getElementById(id);const mobile=matchMedia('(max-width:759px)');const narrow=matchMedia('(max-width:1179px)');
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function visible(){const q=$('search').value.toLowerCase().trim();return data.filter(d=>(category==='All items'||d.type===category)&&[d.title,d.edition,d.notes].some(v=>v.toLowerCase().includes(q)))}
function renderCategories(){const root=$('categories');root.replaceChildren();for(const type of ['All items',...types]){const b=element('button','category',type);b.type='button';b.setAttribute('aria-pressed',String(type===category));b.append(element('span','',String(data.filter(d=>type==='All items'||d.type===type).length)));b.onclick=()=>{category=type;renderCategories();renderResults()};root.append(b)}}
function renderResults(){const rows=visible();$('result-count').textContent=`${rows.length} ${rows.length===1?'item':'items'} shown`;const root=$('results');root.className=view==='bricks'?'bricks':'';root.replaceChildren();if(view==='list'){const head=element('div','column-head');head.setAttribute('aria-hidden','true');for(const label of ['Name','Edition','Location'])head.append(element('span','',label));root.append(head)}if(!rows.length){root.append(element('p','empty','No matching items. Try another search or category.'));return}for(const type of types){const group=rows.filter(d=>d.type===type);if(!group.length)continue;const section=element('section','group');const heading=element('h2','',type);section.append(heading);const ul=element('ul','items');for(const d of group){const li=element('li');const b=element('button','item');b.id=`item-${d.id}`;b.type='button';b.setAttribute('aria-pressed',String(d.id===selected));b.setAttribute('aria-label',`Open ${d.title}`);const title=element('span','item-title',d.title);title.title=d.title;const edition=element('span','item-edition',d.edition);edition.title=d.edition;const location=element('span','item-location',d.location);location.title=d.location;b.append(title,edition,location,element('span','tile-note',d.notes));b.onclick=()=>{selected=d.id;renderResults();renderDetail();$('workspace').classList.add('show-detail');$('detail-title').focus()};li.append(b);ul.append(li)}section.append(ul);root.append(section)}}
function renderDetail(){const d=data.find(x=>x.id===selected);const root=$('detail');root.replaceChildren();if(!d){root.append(element('p','empty','Select an item to see its details.'));return}const h=element('h2','detail-title',d.title);h.id='detail-title';h.tabIndex=-1;root.append(h,element('p','detail-edition',d.edition||d.type));const facts=element('dl','facts');for(const [key,value] of [['Category',d.type],['Location',d.location],['Condition',d.condition]]){const pair=element('div');pair.append(element('dt','',key),element('dd','',value));facts.append(pair)}root.append(facts);for(const [title,body] of [['Notes',d.notes||'No notes yet.'],['Identification',d.identity]]){const section=element('section','detail-section');section.append(element('h3','',title),element('p','',body));root.append(section)}const edit=element('button','detail-action','Edit copy');edit.type='button';edit.onclick=()=>{$('notice').textContent='This concept shows the layout. The full copy editor will retain its existing save, photo, storage and history controls.'};root.append(edit)}
function switchView(next){view=next;$('list-view').setAttribute('aria-pressed',String(view==='list'));$('brick-view').setAttribute('aria-pressed',String(view==='bricks'));renderResults()}
$('list-view').onclick=()=>switchView('list');$('brick-view').onclick=()=>switchView('bricks');$('search').oninput=renderResults;
$('back').onclick=()=>{$('workspace').classList.remove('show-detail');const row=$(`item-${selected}`);(row||$('search')).focus()};
let barcodeTimer;function openReview(){clearTimeout(barcodeTimer);const value=$('quick-entry').value.trim();if(!value){$('quick-entry').focus();return}const barcode=/^\d{8,14}$/.test(value);$('intake-form').hidden=false;$('quick-entry').setAttribute('aria-expanded','true');$('title').value=barcode?'':value;$('barcode-status').hidden=!barcode;$('barcode-status').textContent=barcode?`Barcode ${value}. No catalog lookup in this preview; add a title to continue.`:'';$('scanner').hidden=true;$('scan').setAttribute('aria-expanded','false');$('title').focus()}
$('quick-form').onsubmit=e=>{e.preventDefault();openReview()};
$('quick-entry').oninput=()=>{clearTimeout(barcodeTimer);if(/^\d{8,14}$/.test($('quick-entry').value.trim()))barcodeTimer=setTimeout(openReview,500)};
$('scan').onclick=()=>{$('scanner').hidden=!$('scanner').hidden;$('scan').setAttribute('aria-expanded',String(!$('scanner').hidden));if(!$('scanner').hidden)$('sample-scan').focus()};
$('cancel-scan').onclick=()=>{$('scanner').hidden=true;$('scan').setAttribute('aria-expanded','false');$('scan').focus()};
$('sample-scan').onclick=()=>{$('quick-entry').value='012345678905';openReview()};
$('collapse-intake').onclick=()=>{$('intake-form').hidden=true;$('quick-entry').setAttribute('aria-expanded','false');$('quick-entry').focus()};
$('intake-form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').setCustomValidity('Enter a title.');$('title').reportValidity();return}const item={id:Math.max(...data.map(d=>d.id))+1,type:$('type').value,title,edition:'',location:'Unassigned',notes:$('notes').value.trim(),condition:'Not recorded',identity:'Not identified'};data.unshift(item);selected=item.id;category='All items';$('search').value='';$('intake-form').reset();$('quick-entry').value='';$('intake-form').hidden=true;$('quick-entry').setAttribute('aria-expanded','false');$('quick-entry').focus();$('save-status').textContent='Copy added to this preview.';renderCategories();renderResults();renderDetail()};$('title').oninput=()=>{$('title').setCustomValidity('')};
for(const b of document.querySelectorAll('[data-utility]'))b.onclick=()=>{$('notice').textContent=`${b.dataset.utility} remains in the utility menu. This standalone layout concept does not change your app settings or session.`;$('menu').open=false};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('menu').open){$('menu').open=false;$('menu').querySelector('summary').focus()}});
narrow.addEventListener('change',()=>{$('workspace').classList.remove('show-detail')});renderCategories();renderResults();renderDetail();
</script>
</body>
</html>
