# Disposable test stack. No host ports, production volumes, or external networks.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relicrat_test
      POSTGRES_USER: relicrat_test
      POSTGRES_PASSWORD: disposable-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relicrat_test -d relicrat_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: ../../apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://relicrat_test:disposable-test-only@db:5432/relicrat_test
      TEST_DATABASE_URL: postgresql+psycopg://relicrat_test:disposable-test-only@db:5432/relicrat_test
    depends_on:
      db:
        condition: service_healthy
networks:
  default:
    internal: true
