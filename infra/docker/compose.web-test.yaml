# Synthetic browser/API integration: no host ports and no existing data.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relicrat_web_test
      POSTGRES_USER: relicrat_web_test
      POSTGRES_PASSWORD: disposable-web-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U relicrat_web_test -d relicrat_web_test]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    env_file: owner-test.env
    build:
      context: ../../apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://relicrat_web_test:disposable-web-test-only@db:5432/relicrat_web_test
      MEDIA_ROOT: /var/lib/relicrat/media
    volumes:
      - media:/var/lib/relicrat/media
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ../../apps/web
    environment:
      RELICRAT_API_URL: http://api:8000
      RELICRAT_WEB_ORIGIN: ${RELICRAT_TEST_WEB_ORIGIN:-http://127.0.0.1:3000}
      RELICRAT_ALLOW_LOOPBACK_HTTP: '1'
      RELICRAT_TEST_OWNER_PASSWORD: synthetic-only-owner-password
      RELICRAT_SYNTHETIC_SMOKE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      - api
volumes:
  media:
networks:
  default:
    internal: true
