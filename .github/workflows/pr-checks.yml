name: PR checks

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  api:
    name: API and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test API and migrations on disposable PostgreSQL
        run: sh scripts/test-api.sh
      - name: Test operations and missed backup alerts
        run: python3 -m unittest discover -s scripts -p test_operations.py

  web:
    name: Web build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build

  csv-browser:
    name: CSV import browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELICRAT_WEB_ORIGIN: http://127.0.0.1:3000
      RELICRAT_ALLOW_LOOPBACK_HTTP: '1'
      RELICRAT_API_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Chromium and build the web app
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Start disposable PostgreSQL and API
        run: |
          cat > "$RUNNER_TEMP/csv-browser-compose.yaml" <<'COMPOSE'
          services:
            api:
              ports:
                - "127.0.0.1:8000:8000"
          networks:
            default:
              internal: false
          COMPOSE
          compose() {
            docker compose -p relicrat-csv-ci -f infra/docker/compose.web-test.yaml \
              -f "$RUNNER_TEMP/csv-browser-compose.yaml" "$@"
          }
          compose up -d --wait db
          compose run --build --rm --no-deps api alembic upgrade head
          compose up -d --no-deps api
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 "$RELICRAT_API_URL/health"
      - name: Run desktop and mobile import and storage journeys
        working-directory: apps/web
        run: |
          export RELICRAT_TEST_WEB_URL="$RELICRAT_WEB_ORIGIN"
          ./node_modules/.bin/next start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/csv-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 -o /dev/null "$RELICRAT_WEB_ORIGIN/login"
          node --test \
            --test-name-pattern='^(review, retry and undo overlapping CSV imports|organize a large CSV import) on (desktop|mobile)$' \
            tests/import.browser.mjs
          node --test tests/location-browse.browser.mjs
      - name: Exercise the read-only MCP server on the disposable API
        env:
          RELICRAT_TEST_DISPOSABLE_MCP_API: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/relicrat-mcp"
          "$RUNNER_TEMP/relicrat-mcp/bin/python" -m pip install -r apps/mcp/requirements.txt
          "$RUNNER_TEMP/relicrat-mcp/bin/python" apps/mcp/smoke_test.py
      - name: Remove the disposable stack
        if: always()
        run: |
          override="$RUNNER_TEMP/csv-browser-compose.yaml"
          if [ -f "$override" ]; then
            docker compose -p relicrat-csv-ci -f infra/docker/compose.web-test.yaml \
              -f "$override" down --volumes --remove-orphans
          fi

  linux-install:
    name: Private Linux Compose install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: relicrat
      COMPOSE_FILE: compose.linux.yaml
      RELICRAT_TEST_LINUX_INSTALL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare browser tooling
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Follow the private install guide
        run: |
          export RELICRAT_RELEASE="$(git rev-parse HEAD)"
          printf 'RELICRAT_RELEASE=%s\n' "$RELICRAT_RELEASE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import runpy, sys
          from unittest.mock import patch
          sys.argv = ['scripts/configure-owner.py', '--origin', 'http://127.0.0.1:3000',
                      '--allow-loopback-http', '--generate-database-password', '--output', '.env']
          with patch('getpass.getpass', return_value='synthetic-only-linux-install-password'):
              runpy.run_path(sys.argv[0], run_name='__main__')
          PY
          test "$(stat -c %a .env)" = 600
          docker pull postgres:17-alpine
          docker compose build --pull
          docker compose up -d --wait db
          docker compose run --rm --no-deps api alembic upgrade head
          docker compose up -d --no-build --wait
      - name: Verify private binding and blocked app egress
        run: |
          test "$(docker network inspect relicrat_default --format '{{.Internal}}')" = true
          for service in web api db; do
            container="$(docker compose ps -q "$service")"
            test "$(docker inspect "$container" --format '{{len .NetworkSettings.Networks}}')" = 1
            test "$(docker inspect "$container" --format '{{.HostConfig.RestartPolicy.Name}}')" = unless-stopped
            docker compose exec -T "$service" awk '$2 == "00000000" { exit 1 }' /proc/net/route
            test "$(docker inspect "$container" --format '{{len .HostConfig.PortBindings}}')" = 0
          done
          docker compose exec -T api python - <<'PY'
          import errno, socket
          try:
              socket.create_connection(('1.1.1.1', 443), timeout=3).close()
          except OSError as error:
              assert error.errno in {errno.ENETUNREACH, errno.EHOSTUNREACH}, error
          else:
              raise AssertionError('The API reached an external address')
          PY
      - name: Add, photograph, move and find copies from desktop and phone
        run: |
          sudo apt-get install -y socat
          sh scripts/linux-install-browser-check.sh
      - name: Take the pre-upgrade backup and verify persistence after recreation
        run: |
          python3 scripts/backup.py create --engine "$(docker info --format '{{.Name}}')" \
            --compose compose.linux.yaml --project relicrat --offline-confirmed "$RUNNER_TEMP/relicrat-backup"
          test -s "$RUNNER_TEMP/relicrat-backup/manifest.json"
          docker compose down
          docker compose up -d --no-build --wait
          RELICRAT_TEST_AFTER_RESTART=1 sh scripts/linux-install-browser-check.sh
      - name: Transfer Blueprint between clean Linux installs
        run: |
          export RELICRAT_THEME_SCREENSHOTS="$RUNNER_TEMP/theme-screenshots"
          mkdir "$RELICRAT_THEME_SCREENSHOTS"
          transfer="$RUNNER_TEMP/blueprint-export.json"
          sh scripts/linux-install-browser-check.sh apps/web/tests/theme-transfer.browser.mjs export "$transfer"
          export COMPOSE_PROJECT_NAME=relicrat-theme-recipient
          test -z "$(docker compose ps -aq)"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          docker compose up -d --wait db
          docker compose run --rm --no-deps api alembic upgrade head
          docker compose up -d --no-build --wait
          sh scripts/linux-install-browser-check.sh apps/web/tests/theme-transfer.browser.mjs import "$transfer"
      - name: Upload Blueprint previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blueprint-previews
          path: ${{ runner.temp }}/theme-screenshots/*.png
          if-no-files-found: error
      - name: Remove the disposable install
        if: always()
        run: |
          if [ -f .env ] && [ -n "$RELICRAT_RELEASE" ]; then
            COMPOSE_PROJECT_NAME=relicrat-theme-recipient docker compose down --volumes
            docker compose down --volumes
          fi
